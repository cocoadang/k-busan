name: Validate and deploy K-busan
# Pull requests validate only. Main pushes and manual main runs deploy after validation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# Filled in from ops/setup-github-deploy.sh output (one-time GCP setup).
env:
  GCP_PROJECT_ID: busan-redevelopment
  GCP_PROJECT_NUMBER: '432348267432'
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: busan-redevelopment-news-monitor
  AR_REPO: kbusan-images

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: python3 -m unittest discover -s ops -p "test_*.py"
      - run: node --import tsx --test src/tests/*.test.ts
      - run: node --import tsx --test src/analyzer/openaiClient.test.ts
      - run: npm run build

  deploy:
    needs: validate
    if: github.repository == 'cocoadang/k-busan' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: kbusan-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deploy configuration
        run: |
          for v in GCP_PROJECT_ID GCP_PROJECT_NUMBER GCP_REGION CLOUD_RUN_SERVICE; do
            [ -n "${!v}" ] || { echo "::error::$v is empty. Run ops/setup-github-deploy.sh and fill the workflow env."; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (clean Linux build, no local node_modules)
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/k-busan:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/kbusan-github/providers/github-main
          service_account: kbusan-github-deploy@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Resolve deploy region
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(metadata.name)' > /dev/null
          echo "DEPLOY_REGION=$GCP_REGION" >> "$GITHUB_ENV"
      - name: Push image
        run: |
          gcloud auth configure-docker "${DEPLOY_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"
      - name: Deploy candidate, verify search, and promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/deploy_apt_production.py
