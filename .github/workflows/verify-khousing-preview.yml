name: Verify K-Housing preview

on:
  workflow_call:
    inputs:
      khousing_origin:
        type: string
        required: true
      apt_origin:
        type: string
        required: true
      expected_revision:
        type: string
        required: true
      history_fixture_month:
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify the pinned release, trade history, and stored floor plans
        env:
          KHOUSING_PREVIEW_ORIGIN: ${{ inputs.khousing_origin }}
          APT_PREVIEW_ORIGIN: ${{ inputs.apt_origin }}
          KHOUSING_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          KHOUSING_HISTORY_FIXTURE_MONTH: ${{ inputs.history_fixture_month }}
        run: node ops/verify-khousing-preview.mjs
