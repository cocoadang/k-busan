name: Validate and deploy K-busan
# Validation runs on every push to main and every pull request.
# Production deployment runs ONLY on "Run workflow" (workflow_dispatch) on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# Filled in from ops/setup-github-deploy.sh output (one-time GCP setup).
env:
  GCP_PROJECT_ID: busan-redevelopment
  GCP_PROJECT_NUMBER: '432348267432'
  # Preferred region (Seoul). Until ops/migrate-to-seoul.sh has created the service there,
  # deploys keep going to the original region (FALLBACK_REGION).
  GCP_REGION: asia-northeast3
  FALLBACK_REGION: asia-south1
  CLOUD_RUN_SERVICE: busan-redevelopment-news-monitor
  AR_REPO: kbusan-images

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: node --import tsx --test src/tests/*.test.ts
      - run: npm run build

  deploy:
    needs: validate
    if: github.repository == 'cocoadang/k-busan' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: kbusan-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deploy configuration
        run: |
          for v in GCP_PROJECT_ID GCP_PROJECT_NUMBER GCP_REGION CLOUD_RUN_SERVICE; do
            [ -n "${!v}" ] || { echo "::error::$v is empty. Run ops/setup-github-deploy.sh and fill the workflow env."; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/kbusan-github/providers/github-main
          service_account: kbusan-github-deploy@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Resolve deploy region
        run: |
          if gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
               --format='value(metadata.name)' >/dev/null 2>&1; then
            REGION="$GCP_REGION"
          else
            REGION="$FALLBACK_REGION"
            echo "::notice::Service not found in $GCP_REGION yet; deploying to $FALLBACK_REGION."
          fi
          echo "DEPLOY_REGION=$REGION" >> "$GITHUB_ENV"
          echo "deploy region: $REGION"
      - name: Build image (clean Linux build, no local node_modules)
        run: |
          IMAGE="${DEPLOY_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/k-busan:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
      - name: Push image
        run: |
          gcloud auth configure-docker "${DEPLOY_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"
      - name: Deploy candidate without traffic
        # The service was first created from source (AI Studio), which left
        # "run.googleapis.com/sources" style annotations that block an image-only deploy.
        # Export the live spec, drop only those source/build annotations, swap the image,
        # and pin the current revision at 100% while the new one gets the "candidate" tag.
        # Env vars, secrets, service account, scaling and timeout are carried over as-is.
        # The exported spec may contain env values, so it is never printed.
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$DEPLOY_REGION" --project "$GCP_PROJECT_ID" \
            --format=export > /tmp/service.yaml
          CURRENT="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$DEPLOY_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')"
          NEW_REV="${CLOUD_RUN_SERVICE}-${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}"
          CURRENT="$CURRENT" NEW_REV="$NEW_REV" python3 - <<'PY'
          import os, yaml
          path = '/tmp/service.yaml'
          svc = yaml.safe_load(open(path))
          def strip(meta):
              ann = (meta or {}).get('annotations') or {}
              removed = [k for k in list(ann) if k.startswith('run.googleapis.com/') and ('source' in k or 'build' in k)]
              for k in removed: ann.pop(k)
              return removed
          removed = strip(svc.get('metadata')) + strip(svc['spec']['template'].get('metadata'))
          print('removed annotations:', removed)
          tmpl = svc['spec']['template']
          tmpl.setdefault('metadata', {})['name'] = os.environ['NEW_REV']
          containers = tmpl['spec']['containers']
          assert len(containers) == 1, 'expected a single container'
          containers[0]['image'] = os.environ['IMAGE']
          svc['spec']['traffic'] = [
              {'revisionName': os.environ['CURRENT'], 'percent': 100},
              {'revisionName': os.environ['NEW_REV'], 'tag': 'candidate'},
          ]
          yaml.safe_dump(svc, open(path, 'w'), sort_keys=False)
          PY
          python3 - <<'PY'
          # Print non-secret runtime settings (no env values) for review.
          import yaml
          svc = yaml.safe_load(open('/tmp/service.yaml'))
          t = svc['spec']['template']; ann = (t.get('metadata') or {}).get('annotations') or {}
          c = t['spec']['containers'][0]
          print('runtime settings:', {
              'resources': c.get('resources'), 'concurrency': t['spec'].get('containerConcurrency'),
              'timeoutSeconds': t['spec'].get('timeoutSeconds'),
              'annotations': {k: v for k, v in ann.items() if 'autoscaling' in k or 'cpu' in k or 'startup' in k or 'execution' in k},
              'envNames': sorted(e['name'] for e in c.get('env', [])),
          })
          PY
          echo "current revision: $CURRENT -> candidate: $NEW_REV"
          gcloud run services replace /tmp/service.yaml --region "$DEPLOY_REGION" --project "$GCP_PROJECT_ID" --quiet > /dev/null
          rm -f /tmp/service.yaml
      - name: Verify candidate (read-only)
        run: |
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$DEPLOY_REGION" --project "$GCP_PROJECT_ID" \
            --format=json | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['url'] for t in d['status']['traffic'] if t.get('tag')=='candidate'))")"
          echo "candidate: $URL"
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL/api/health" || true)"
            [ "$code" = 200 ] && break; sleep 10
          done
          [ "$code" = 200 ] || { echo "::error::health $code"; cat /tmp/health.json; exit 1; }
          python3 - <<'PY'
          import json
          h = json.load(open('/tmp/health.json'))
          assert h.get('status') == 'ok', h
          assert h.get('firestoreReady') is True, 'Firestore not ready on candidate'
          print('firestoreReady', h['firestoreReady'], 'gemini', h['checks']['gemini'])
          PY
          curl -sf "$URL/api/registry" > /dev/null
          curl -sf "$URL/" | grep -q '<div id="root">'
      - name: Promote candidate to 100% traffic
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --region "$DEPLOY_REGION" \
            --project "$GCP_PROJECT_ID" --to-tags candidate=100 --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$DEPLOY_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(status.latestReadyRevisionName,status.url)'
